name: Branch hygiene

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete stale automation branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/" \
            --jq '.[].ref' \
          | sed 's#^refs/heads/##' \
          | while IFS= read -r branch; do
              case "${branch}" in
                main|bot/weekly-jobs)
                  continue
                  ;;
                bot/weekly-jobs-*)
                  open_count="$(gh pr list --state open --head "${branch}" --json number --jq 'length')"
                  if [[ "${open_count}" == "0" ]]; then
                    echo "Deleting stale weekly branch: ${branch}"
                    gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
                  fi
                  ;;
                agent/*)
                  merged_count="$(gh pr list --state merged --head "${branch}" --json number --jq 'length')"
                  open_count="$(gh pr list --state open --head "${branch}" --json number --jq 'length')"
                  if [[ "${merged_count}" != "0" && "${open_count}" == "0" ]]; then
                    echo "Deleting merged agent branch: ${branch}"
                    gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
                  fi
                  ;;
              esac
            done
